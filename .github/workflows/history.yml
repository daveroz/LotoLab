name: Update draw history
# Twice a day, adds the newest Dorado, Baloto, Revancha and MiLoto results to
# app/src/main/assets/history/*.csv and commits them to the default branch. The app downloads these
# files from raw.githubusercontent.com, so it has the full history even after weeks offline, and every
# new APK build bundles them. Run it from the Actions tab with "backfill" to walk the whole archive again.
on:
  schedule:
    - cron: '41 5 * * *'   # 00:41 in Colombia, after the night draws
    - cron: '23 21 * * *'  # 16:23 in Colombia, after the morning and afternoon draws
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Walk back through the whole archive (slow)'
        type: boolean
        default: false

permissions:
  contents: write # to commit the updated history

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch the newest draws
        run: python3 scripts/update_history.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- app/src/main/assets/history; then
            echo "No new draws."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/history
          git commit -m "Update draw history"
          git push
